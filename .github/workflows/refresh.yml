name: refresh tape

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_tape.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tape
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull public sources
        run: python scripts/refresh_tape.py
      - name: Commit tape if it moved
        run: |
          git config user.name "tape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tape.json
          if git diff --cached --quiet; then
            echo "tape unchanged"
          else
            git commit -m "chore: refresh tape"
            git push
          fi
